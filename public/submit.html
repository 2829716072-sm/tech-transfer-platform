<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>提交成果 · 科技成果转化平台</title>
<meta name="description" content="提交科技成果或技术需求，审核通过后公开展示" />
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<div id="nav"></div>

<div class="wrap form-wrap">
  <header class="page-head">
    <span class="badge">成果登记</span>
    <h1 id="formTitle">提交项目信息</h1>
    <p id="formDesc">填写后将由管理员审核，通过后公开展示并开放联系方式对接</p>
  </header>

  <form class="card form-card" id="form" autocomplete="off">
    <h2 class="section-title">基本信息</h2>

    <div class="field">
      <label>项目名称<span class="req">*</span></label>
      <input type="text" name="projectName" id="projectName" required maxlength="200" placeholder="例如：高效钙钛矿太阳能电池中试项目" />
    </div>

    <div class="row2">
      <div class="field">
        <label>公司 / 机构<span class="req">*</span></label>
        <input type="text" name="companyName" id="companyName" required maxlength="200" placeholder="所属单位或企业名称" />
      </div>
      <div class="field">
        <label>类型<span class="req">*</span></label>
        <select name="projectType" id="projectType" required>
          <option value="">请选择</option>
          <option value="supply">成果供给（转出技术/成果）</option>
          <option value="demand">技术需求（寻求技术）</option>
        </select>
      </div>
    </div>

    <div class="row2">
      <div class="field">
        <label>技术领域<span class="req">*</span></label>
        <select name="techField" id="techField" required>
          <option value="">请选择</option>
          <option>新一代信息技术</option>
          <option>高端装备</option>
          <option>新材料</option>
          <option>生物医药</option>
          <option>新能源</option>
          <option>节能环保</option>
          <option>数字创意</option>
          <option>其他</option>
        </select>
      </div>
      <div class="field">
        <label>成熟度<span class="req">*</span></label>
        <select name="maturity" id="maturity" required>
          <option value="">请选择</option>
          <option>实验室阶段</option>
          <option>小试阶段</option>
          <option>中试阶段</option>
          <option>产业化阶段</option>
        </select>
      </div>
    </div>

    <h2 class="section-title">项目详情</h2>

    <div class="field">
      <label>项目基本信息</label>
      <textarea name="projectInfo" id="projectInfo" maxlength="4000" placeholder="技术原理、核心指标、知识产权情况、应用场景等"></textarea>
    </div>

    <div class="field">
      <label>项目最新情况</label>
      <textarea name="projectStatus" id="projectStatus" maxlength="4000" placeholder="近期进展、关键节点、当前所处环节等"></textarea>
    </div>

    <div class="field">
      <label>需求</label>
      <textarea name="requirements" id="requirements" maxlength="4000" placeholder="对接资源、资金、技术、人才、市场、政策支持等具体需求"></textarea>
    </div>

    <h2 class="section-title">联系与技术经理人</h2>

    <div class="row3">
      <div class="field">
        <label>联系人<span class="req">*</span></label>
        <input type="text" name="contactName" id="contactName" required maxlength="100" placeholder="对接联系人姓名" />
      </div>
      <div class="field">
        <label>联系电话</label>
        <input type="text" name="contactPhone" id="contactPhone" maxlength="30" placeholder="手机或座机" />
      </div>
      <div class="field">
        <label>联系邮箱</label>
        <input type="email" name="contactEmail" id="contactEmail" maxlength="100" placeholder="对外联系邮箱" />
      </div>
    </div>

    <div class="field">
      <label>技术经理人名称<span class="req">*</span></label>
      <input type="text" name="managerName" id="managerName" required maxlength="100" placeholder="对接该项目的技术经理人" />
    </div>

    <div class="field">
      <label>技术经理人评价</label>
      <textarea name="managerComment" id="managerComment" maxlength="4000" placeholder="技术可行性、市场前景、转化路径建议、风险提示等"></textarea>
    </div>

    <div class="msg" id="msg"></div>

    <div class="actions">
      <button type="submit" class="btn-primary" id="submitBtn">提交登记</button>
      <button type="button" class="btn-ghost" id="resetBtn">清空重填</button>
      <span class="form-hint">提交后进入「待审核」状态，可在「我的项目」查看进度</span>
    </div>
  </form>
</div>

<div id="footer"></div>
<script type="module" src="/submit.js"></script>
</body>
</html>
